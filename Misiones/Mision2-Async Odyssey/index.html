<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async Odyssey · Rick and Morty</title>
  </head>
  <body>
    <h1>Buscador de Rick and Morty</h1>

    <form id="filtros">
      <input name="nombre" type="search" placeholder="Nombre (ej. Rick)" />
      <select name="estado">
        <option value="">Todos</option>
        <option value="alive">Vivos</option>
        <option value="dead">Muertos</option>
        <option value="unknown">Desconocido</option>
      </select>
      <button type="submit">Buscar</button>
    </form>

    <p id="estado"></p>
    <p id="resumen"></p>
    <ul id="lista"></ul>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
